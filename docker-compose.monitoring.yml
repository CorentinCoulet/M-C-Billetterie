# ===================================================================
# MONITORING STACK - UNIVERSAL
# Prometheus, Grafana, and exporters for metrics collection
# Can be combined with dev or prod environments
# Uses environment variables to adapt to the target environment
# ===================================================================

services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-${COMPOSE_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data_${COMPOSE_ENV:-dev}:/prometheus
    networks:
      - ${COMPOSE_NETWORK:-billetterie-network-dev}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana-${COMPOSE_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data_${COMPOSE_ENV:-dev}:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - ${COMPOSE_NETWORK:-billetterie-network-dev}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.13.2
    container_name: postgres-exporter-${COMPOSE_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@${DB_HOST:-db-dev}:5432/${DB_NAME:-billetterie}?sslmode=disable"
    networks:
      - ${COMPOSE_NETWORK:-billetterie-network-dev}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Exporter - Cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: redis-exporter-${COMPOSE_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: "${REDIS_HOST:-redis-dev}:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-password}"
    networks:
      - ${COMPOSE_NETWORK:-billetterie-network-dev}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter - Universal mode (works on Windows + Linux)
  # Monitors container metrics without host mount
  # On Windows: monitors Docker Desktop VM
  # On Linux: monitors container-level metrics (not full host)
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter-${COMPOSE_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/proc'
      - '--path.sysfs=/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - ${COMPOSE_NETWORK:-billetterie-network-dev}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # Note: For full Linux host metrics in production, use this configuration instead:
  # Uncomment and replace the above service with:
  #
  # node-exporter-full:
  #   image: prom/node-exporter:v1.6.1
  #   container_name: node-exporter-${COMPOSE_ENV:-dev}
  #   restart: unless-stopped
  #   ports:
  #     - "${NODE_EXPORTER_PORT:-9100}:9100"
  #   command:
  #     - '--path.rootfs=/host'
  #   volumes:
  #     - '/:/host:ro,rslave'  # Only works on Linux!
  #   networks:
  #     - ${COMPOSE_NETWORK:-billetterie-network-dev}

  # AlertManager - Alert management
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager-${COMPOSE_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data_${COMPOSE_ENV:-dev}:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - ${COMPOSE_NETWORK:-billetterie-network-dev}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prometheus_data_dev:
  prometheus_data_prod:
  grafana_data_dev:
  grafana_data_prod:
  alertmanager_data_dev:
  alertmanager_data_prod:

networks:
  billetterie-network-dev:
    name: billetterie-dev-network
  billetterie-network:
    name: billetterie-network

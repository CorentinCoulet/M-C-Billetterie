# Advanced Monitoring Configuration
# Enhanced Prometheus rules for production monitoring

groups:
  - name: billetterie_critical_alerts
    rules:
      # Application Health
      - alert: ApplicationDown
        expr: up{job="billetterie"} == 0
        for: 30s
        labels:
          severity: critical
          category: availability
          team: platform
        annotations:
          summary: "Billetterie application is down"
          description: "Application {{ $labels.instance }} has been down for more than 30 seconds"
          runbook: "https://wiki.company.com/runbooks/app-down"
          impact: "Users cannot access the ticketing system"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      # Security Alerts
      - alert: BruteForceAttack
        expr: increase(security_events_total{type="brute_force"}[5m]) > 10
        for: 0m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Brute force attack detected"
          description: "{{ $value }} brute force attempts detected in 5 minutes from IP {{ $labels.ip }}"
          runbook: "https://wiki.company.com/security/brute-force"

      - alert: FraudDetected
        expr: increase(fraud_events_total[5m]) > 5
        for: 0m
        labels:
          severity: critical
          category: fraud
        annotations:
          summary: "Multiple fraud attempts detected"
          description: "{{ $value }} fraud attempts in the last 5 minutes"
          runbook: "https://wiki.company.com/security/fraud-response"

      - alert: SuspiciousPaymentActivity
        expr: increase(payment_attempts_total{result="blocked"}[10m]) > 3
        for: 0m
        labels:
          severity: high
          category: security
        annotations:
          summary: "Suspicious payment activity"
          description: "{{ $value }} blocked payment attempts in 10 minutes"

      # Database Alerts
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database is down"
          description: "PostgreSQL database has been unreachable for 30+ seconds"
          runbook: "https://wiki.company.com/runbooks/db-down"

      - alert: DatabaseConnectionsHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Database connections near limit"
          description: "{{ $value | humanizePercentage }} of max connections in use"

      - alert: DatabaseSlowQueries
        expr: avg(pg_stat_statements_mean_time_ms) > 1000
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}ms"

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
          category: cache
        annotations:
          summary: "Redis is down"
          description: "Redis cache server is unreachable"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: memory
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

      # Performance Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High response time"
          description: "95th percentile response time is {{ $value }}s"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 15m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }}"

      - alert: HighMemoryUsage
        expr: process_memory_usage_percent > 85
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"

      - alert: DiskSpaceLow
        expr: disk_usage_percent > 85
        for: 5m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Disk space running low"
          description: "Disk usage is {{ $value }}%"

  - name: billetterie_business_alerts
    rules:
      # Business Logic Alerts
      - alert: PaymentFailuresHigh
        expr: rate(stripe_payment_failures_total[15m]) > 0.1
        for: 5m
        labels:
          severity: high
          category: business
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }}"

      - alert: TicketSalesDown
        expr: rate(tickets_sold_total[1h]) < 1
        for: 30m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Ticket sales significantly down"
          description: "Only {{ $value }} tickets sold in the last hour"

      - alert: UnusualTrafficPattern
        expr: rate(http_requests_total[5m]) > 100
        for: 15m
        labels:
          severity: high
          category: traffic
        annotations:
          summary: "Unusual traffic spike detected"
          description: "Request rate is {{ $value }} requests/second"

      # Data Integrity Alerts
      - alert: BackupFailed
        expr: backup_status != 1
        for: 0m
        labels:
          severity: high
          category: backup
        annotations:
          summary: "Backup operation failed"
          description: "Last backup operation failed at {{ $labels.timestamp }}"
          runbook: "https://wiki.company.com/runbooks/backup-failure"

      - alert: DataInconsistency
        expr: data_consistency_check != 1
        for: 0m
        labels:
          severity: critical
          category: data
        annotations:
          summary: "Data inconsistency detected"
          description: "Data consistency check failed"

  - name: billetterie_infrastructure_alerts
    rules:
      # Kubernetes Alerts
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: "Pod is crash looping"
          description: "Pod {{ $labels.pod }} is restarting frequently"

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="false"} == 1
        for: 10m
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: "Pod not ready"
          description: "Pod {{ $labels.pod }} has been not ready for 10+ minutes"

      - alert: NodeNotReady
        expr: kube_node_status_ready{condition="false"} == 1
        for: 5m
        labels:
          severity: critical
          category: kubernetes
        annotations:
          summary: "Kubernetes node not ready"
          description: "Node {{ $labels.node }} is not ready"

      # SSL/TLS Certificate Alerts
      - alert: SSLCertificateExpiring
        expr: ssl_certificate_expiry_days < 30
        for: 1h
        labels:
          severity: warning
          category: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.domain }} expires in {{ $value }} days"

      - alert: SSLCertificateExpired
        expr: ssl_certificate_expiry_days < 0
        for: 0m
        labels:
          severity: critical
          category: ssl
        annotations:
          summary: "SSL certificate expired"
          description: "SSL certificate for {{ $labels.domain }} has expired"

  - name: billetterie_custom_metrics
    rules:
      # Custom Business Metrics
      - record: billetterie:payment_success_rate
        expr: rate(stripe_payments_success_total[5m]) / rate(stripe_payments_total[5m])

      - record: billetterie:avg_response_time
        expr: histogram_quantile(0.5, rate(http_request_duration_seconds_bucket[5m]))

      - record: billetterie:error_rate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])

      - record: billetterie:active_users
        expr: count(increase(user_login_total[24h]))

      - record: billetterie:revenue_per_hour
        expr: sum(increase(payment_amount_total[1h]))

# Alertmanager Configuration
alertmanager_config: |
  global:
    smtp_smarthost: 'smtp.company.com:587'
    smtp_from: 'alerts@company.com'
    smtp_auth_username: 'alerts@company.com'
    smtp_auth_password: 'alert-smtp-password'
    
  route:
    group_by: ['alertname', 'cluster', 'service']
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 1h
    receiver: 'default'
    routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 5s
      repeat_interval: 15m
    - match:
        category: security
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 5m
    - match:
        category: business
      receiver: 'business-team'
    - match:
        category: fraud
      receiver: 'fraud-team'
      group_wait: 0s
      repeat_interval: 1m

  receivers:
  - name: 'default'
    email_configs:
    - to: 'devops@company.com'
      subject: '[ALERT] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      body: |
        {{ range .Alerts }}
        Alert: {{ .Annotations.summary }}
        Description: {{ .Annotations.description }}
        Severity: {{ .Labels.severity }}
        Instance: {{ .Labels.instance }}
        Time: {{ .StartsAt }}
        {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
        {{ end }}

  - name: 'critical-alerts'
    email_configs:
    - to: 'oncall@company.com,devops@company.com'
      subject: '[CRITICAL] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      body: |
        🚨 CRITICAL ALERT 🚨
        
        {{ range .Alerts }}
        Alert: {{ .Annotations.summary }}
        Description: {{ .Annotations.description }}
        Impact: {{ .Annotations.impact }}
        Time: {{ .StartsAt }}
        Runbook: {{ .Annotations.runbook }}
        {{ end }}
    slack_configs:
    - api_url: 'SLACK_WEBHOOK_URL'
      channel: '#alerts-critical'
      title: 'Critical Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      text: |
        {{ range .Alerts }}
        🚨 *{{ .Annotations.summary }}*
        {{ .Annotations.description }}
        *Severity:* {{ .Labels.severity }}
        *Time:* {{ .StartsAt }}
        {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}{{ end }}
        {{ end }}

  - name: 'security-team'
    email_configs:
    - to: 'security@company.com'
      subject: '[SECURITY] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    slack_configs:
    - api_url: 'SLACK_SECURITY_WEBHOOK'
      channel: '#security-alerts'
      
  - name: 'business-team'
    email_configs:
    - to: 'business@company.com'
      subject: '[BUSINESS] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'fraud-team'
    email_configs:
    - to: 'fraud@company.com'
      subject: '[FRAUD] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    slack_configs:
    - api_url: 'SLACK_FRAUD_WEBHOOK'
      channel: '#fraud-alerts'
      
  inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

groups:
  # Security Critical Alerts
  - name: security_critical
    interval: 30s
    rules:
      - alert: HighFailedLoginAttempts
        expr: increase(login_attempts_total{success="false"}[15m]) > 50
        for: 0m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "High number of failed login attempts detected"
          description: "{{ $value }} failed login attempts in the last 15 minutes. Possible brute force attack."

      - alert: SuspiciousPaymentActivity
        expr: rate(payment_failures_total[5m]) > 0.3
        for: 2m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Suspicious payment failure rate"
          description: "Payment failure rate is {{ $value }}. Investigate for potential fraud."

      - alert: UnauthorizedAccessAttempts
        expr: increase(http_requests_total{status="403"}[10m]) > 100
        for: 0m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High number of 403 Forbidden responses"
          description: "{{ $value }} unauthorized access attempts detected."

  # Infrastructure Health
  - name: infrastructure
    interval: 30s
    rules:
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database instance {{ $labels.instance }} is unreachable."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Redis cache is down"
          description: "Redis instance {{ $labels.instance }} is unreachable."

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High number of database connections"
          description: "Database has {{ $value }} active connections."

      - alert: RedisCacheEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High cache eviction rate"
          description: "Redis is evicting {{ $value }} keys/sec. Consider increasing memory."

  # Application Performance
  - name: performance
    interval: 1m
    rules:
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is {{ $value }}s."

      - alert: HighCPUUsage
        expr: 100 - (avg(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU usage on server"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory usage on server"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "High 5xx error rate"
          description: "Error rate is {{ $value }} requests/sec."

  # Business Metrics
  - name: business_metrics
    interval: 2m
    rules:
      - alert: HighRefundRate
        expr: rate(tickets_refunded_total[1h]) / rate(tickets_sold_total[1h]) > 0.15
        for: 30m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "High refund rate detected"
          description: "Refund rate is {{ $value | humanizePercentage }} over the last hour."

      - alert: LowTicketSales
        expr: rate(tickets_sold_total[1h]) < 5
        for: 30m
        labels:
          severity: info
          category: business
        annotations:
          summary: "Low ticket sales rate"
          description: "Only {{ $value }} tickets sold per hour."

      - alert: HighCartAbandonmentRate
        expr: rate(cart_abandoned_total[30m]) / rate(cart_created_total[30m]) > 0.7
        for: 30m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "High cart abandonment rate"
          description: "Cart abandonment rate is {{ $value | humanizePercentage }}."

  # Advanced Monitoring
  - name: advanced_monitoring
    interval: 1m
    rules:
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value }}% disk space remaining on {{ $labels.instance }}."

      - alert: SSLCertificateExpiring
        expr: (ssl_certificate_expiry_seconds - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          category: security
        annotations:
          summary: "SSL certificate expiring soon"
          description: "Certificate expires in {{ $value }} days."

      - alert: QRCodeGenerationFailures
        expr: rate(qr_generation_failures_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "QR code generation failures"
          description: "{{ $value }} QR code generation failures per second."

# Development configuration (automatically applied with docker-compose.yml)
version: "3.8"

services:
  web:
    build:
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - "3000:3000"  # Expose port for development
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    command: yarn dev

  # Development tools
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web interface
    networks:
      - billetterie-network

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@billetterie.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - billetterie-network

volumes:
  pgadmin_data:
# Enterprise-grade production configuration with high availability, security and monitoring
# Use with: docker-compose -f docker-compose.yml -f docker-compose.enterprise.yml up
version: "3.8"

services:
  # HAProxy Load Balancer with SSL termination and high availability
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy-lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"  # Stats interface
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./docker/ssl:/etc/ssl/certs:ro
      - haproxy_logs:/var/log/haproxy
    networks:
      - frontend-network
      - billetterie-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8404/stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Web Application Firewall with ModSecurity
  waf:
    build:
      context: ./docker/waf
      dockerfile: Dockerfile
    container_name: nginx-waf
    restart: always
    expose:
      - "80"
    volumes:
      - ./docker/nginx-waf-enhanced.conf:/etc/nginx/nginx.conf:ro
      - ./docker/modsecurity-custom.conf:/etc/nginx/modsecurity/custom.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - frontend-network
      - billetterie-network
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Override web service for high availability deployment
  web:
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      CLUSTER_MODE: "true"
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      LOG_LEVEL: info
    volumes:
      - app-uploads:/app/uploads
      - app-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # PostgreSQL Primary with streaming replication
  db:
    container_name: postgres-primary
    command: >
      postgres -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c wal_level=replica
      -c max_wal_senders=3
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_REPLICATION_USER: ${DB_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./docker/ssl/server.key:/var/lib/postgresql/server.key:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID

  # PostgreSQL Standby (Read replica)
  db-standby:
    image: postgres:16-alpine
    container_name: postgres-standby
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-billetterie}
      PGUSER: ${DB_REPLICATION_USER}
      PGPASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
      - ./docker/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./docker/ssl/server.key:/var/lib/postgresql/server.key:ro
    networks:
      - billetterie-network
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h db -D /var/lib/postgresql/data -U ${DB_REPLICATION_USER} -W -v -P
        echo 'standby_mode = on' > /var/lib/postgresql/data/recovery.conf
        echo \"primary_conninfo = 'host=db port=5432 user=${DB_REPLICATION_USER}'\" >> /var/lib/postgresql/data/recovery.conf
      fi
      postgres -c config_file=/etc/postgresql/postgresql.conf
      "

  # Redis Master-Slave setup
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    restart: always
    expose:
      - "6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_master_data:/data
    networks:
      - billetterie-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis-slave:
    image: redis:7-alpine
    container_name: redis-slave
    restart: always
    expose:
      - "6379"
    command: >
      redis-server
      --slaveof redis-master 6379
      --masterauth ${REDIS_PASSWORD}
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_slave_data:/data
    networks:
      - billetterie-network
    depends_on:
      redis-master:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # HashiCorp Vault for secrets management
  vault:
    image: vault:1.15
    container_name: vault
    restart: always
    expose:
      - "8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://localhost:8200
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./docker/vault.hcl:/vault/config/vault.hcl:ro
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    networks:
      - billetterie-network
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Elasticsearch for logging and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: always
    expose:
      - "9200"
      - "9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - billetterie-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Logstash for log processing
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    restart: always
    volumes:
      - ./docker/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - app-logs:/logs:ro
    networks:
      - billetterie-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    restart: always
    expose:
      - "5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - billetterie-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Enhanced Prometheus with long-term storage
  prometheus:
    volumes:
      - ./monitoring/prometheus-production.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/security-rules.yml:/etc/prometheus/security-rules.yml:ro
      - ./monitoring/advanced-alert-rules.yml:/etc/prometheus/advanced-alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # AlertManager for alert handling
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    expose:
      - "9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - billetterie-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Enhanced Grafana with security dashboards
  grafana:
    environment:
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_CONTENT_TYPE_PROTECTION=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=nosniff
      - GF_SECURITY_X_XSS_PROTECTION=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Node exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - billetterie-network
    security_opt:
      - no-new-privileges:true

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - billetterie-network

  # Security scanner (profile-based)
  security-scanner:
    image: owasp/zap2docker-stable:latest
    container_name: security-scanner
    restart: "no"
    volumes:
      - ./security-reports:/zap/reports
    networks:
      - frontend-network
    profiles:
      - security-test
    command: >
      zap-baseline.py 
      -t http://haproxy 
      -r security-report.html 
      -x security-report.xml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_standby_data:
  redis_master_data:
  redis_slave_data:
  vault_data:
  vault_logs:
  elasticsearch_data:
  alertmanager_data:
  haproxy_logs:
  app-uploads:
  app-logs:

networks:
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

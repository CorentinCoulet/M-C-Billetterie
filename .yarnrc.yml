# Yarn Modern Configuration for Billetterie Project
# https://yarnpkg.com/configuration/yarnrc

# Node modules linking strategy
nodeLinker: node-modules

# Performance optimizations
enableGlobalCache: true
compressionLevel: mixed
enableInlineBuilds: false
enableMirror: true

# Security configuration
enableScripts: true
enableStrictSsl: true
enableTelemetry: false

# Package resolution
preferInteractive: true
enableImmutableInstalls: false  # Set to true in CI
enableProgressBars: true

# Network optimizations
httpTimeout: 60000
httpRetry: 3
networkConcurrency: 16

# Cache configuration
enableTimers: false
logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0061
    level: discard
  - code: YN0062
    level: discard

# Prevent other package managers and optimize installs
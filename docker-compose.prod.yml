# ===================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# SSL, monitoring, and security hardening
# ===================================================================
version: "3.8"

services:
  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - web
    networks:
      - billetterie-network

  # Let's Encrypt SSL certificate generation
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./docker/ssl:/var/www/certbot
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
    profiles:
      - ssl

  # Override web service for production
  web:
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      SSL_CERT_PATH: /app/ssl/server.crt
      SSL_KEY_PATH: /app/ssl/server.key
      LOG_LEVEL: warn
    volumes:
      - ./docker/ssl:/app/ssl:ro
    expose:
      - "3000"
    ports: []  # Remove direct port exposure
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-admin:
        condition: service_completed_successfully

  # Prisma migrations runner (execute on demand)
  migrate:
    image: node:22-alpine
    container_name: prisma-migrate
    working_dir: /app
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_started
    command: sh -c "yarn config set network-timeout 600000 && yarn install --frozen-lockfile --production=false --network-timeout 600000 && yarn prisma migrate deploy"
    networks:
      - billetterie-network
    profiles:
      - ops

  # Initialize admin account securely (PROD)
  init-admin:
    image: node:22-alpine
    container_name: prisma-init-admin
    working_dir: /app
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - SEED_MODE=admin
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Administrator}
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: sh -c "yarn install --frozen-lockfile --production=false && yarn db:seed"
    networks:
      - billetterie-network

  # PostgreSQL with SSL and security hardening
  db:
    command: >
      postgres -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c log_statement=mod
      -c log_min_duration_statement=1000
      -c log_connections=on
    volumes:
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./docker/ssl/server.key:/var/lib/postgresql/server.key:ro
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only

  # Redis with security hardening
  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --timeout 300
      --tcp-keepalive 300
      --protected-mode yes
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only

  # Automated backup service
  backup:
    image: postgres:16-alpine
    container_name: backup-service
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      - db
    networks:
      - billetterie-network
    profiles:
      - backup

  # ===================================================================
  # PRODUCTION OVERRIDES - Security restrictions
  # ===================================================================

  # Override for tools in prod: bind to localhost only for security
  adminer:
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"  # Localhost only

  pgadmin:
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8082}:80"  # Localhost only

  redis-commander:
    ports:
      - "127.0.0.1:${REDIS_COMMANDER_PORT:-8083}:8081"  # Localhost only

  portainer:
    ports:
      - "127.0.0.1:${PORTAINER_PORT:-9443}:9443"  # Localhost only
      - "127.0.0.1:${PORTAINER_HTTP_PORT:-9000}:9000"  # Localhost only

volumes:
  certbot-etc:
  certbot-var:

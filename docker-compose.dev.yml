# ===================================================================
# DEVELOPMENT ENVIRONMENT - COMPLETELY INDEPENDENT
# ===================================================================

services:
  # Next.js Application - DEVELOPMENT
  web-dev:
    build:
      dockerfile: ./docker/Dockerfile.dev
      target: development
    container_name: billetterie-app-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "9229:9229" # Debug port
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - next_cache_dev:/app/.next
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - billetterie-network-dev
    command: sh -c "yarn dev"

  # PostgreSQL - DEVELOPMENT
  db-dev:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-billetterie}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billetterie-network-dev

  # Redis - DEVELOPMENT
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - billetterie-network-dev

volumes:
  node_modules_dev:
  next_cache_dev:
  postgres_data_dev:
  redis_data_dev:
  uploads_dev:

networks:
  billetterie-network-dev:
    driver: bridge
    name: billetterie-dev-network

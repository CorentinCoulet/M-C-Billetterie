# ===================================================================
# DEVELOPMENT ENVIRONMENT - COMPLETELY INDEPENDENT
# ===================================================================

services:
  # Next.js Application - DEVELOPMENT
  web-dev:
    build:
      dockerfile: ./docker/Dockerfile.dev
      target: development
    container_name: billetterie-app-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "9229:9229" # Debug port
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      # Ultra-fast hot reload
      WATCHPACK_POLLING: "false"
      CHOKIDAR_USEPOLLING: "false"
      FAST_REFRESH: true
      # Disable slow features in dev
      NEXT_TELEMETRY_DISABLED: 1
      TSC_NONPOLLING_WATCHER: true
      # Node.js optimizations
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Avoid JSON issues
      FORCE_COLOR: 0
      CI: false
      # Services
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      HOSTNAME: 0.0.0.0
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - next_cache_dev:/app/.next
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
    networks:
      - billetterie-network-dev
    command: sh -c "yarn dev:docker"

  # Prisma migrations (DEV) — executed on demand or before web-dev starts
  migrate-dev:
    image: node:22-alpine
    container_name: prisma-migrate-dev
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=development
    volumes:
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./yarn.lock:/app/yarn.lock
      - node_modules_dev:/app/node_modules
    depends_on:
      db-dev:
        condition: service_healthy
    command: sh -c "if [ ! -d node_modules/@prisma ]; then yarn add -D prisma @prisma/client --network-timeout 60000; fi && npx prisma migrate deploy && npx prisma generate"
    networks:
      - billetterie-network-dev

  # Prisma seed (DEV) — executed on demand
  seed-dev:
    image: node:22-alpine
    container_name: prisma-seed-dev
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=development
      - SEED_MODE=dev
    volumes:
      - ./:/app
    depends_on:
      db-dev:
        condition: service_healthy
    command: sh -c "yarn install --frozen-lockfile --production=false && yarn db:seed"
    networks:
      - billetterie-network-dev
    profiles:
      - dev-init

  # PostgreSQL - DEVELOPMENT
  db-dev:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-DevPostgres2024!SecureDB}
      POSTGRES_DB: ${DB_NAME:-billetterie}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billetterie-network-dev

  # Redis Cache - DEVELOPMENT
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-DevRedis2024!SecureCache} --appendonly yes
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - billetterie-network-dev

  # ===================================================================
  # DEVELOPMENT-SPECIFIC TOOLS
  # ===================================================================

  # Mailhog - Email testing in development (dev only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"    # Web UI
    networks:
      - billetterie-network-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer - PostgreSQL Web Interface (dev only)
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db-dev
      ADMINER_DESIGN: dracula
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      - billetterie-network-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Commander - Redis Web Interface (dev only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    ports:
      - "8084:8081"
    env_file:
      - .env.dev
    environment:
      PORT: 8081
      REDIS_HOSTS: "local:redis-dev:6379:0:${REDIS_PASSWORD:-password}"
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin}
    depends_on:
      redis-dev:
        condition: service_healthy
    networks:
      - billetterie-network-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/favicon.png"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  node_modules_dev:
  next_cache_dev:
  postgres_data_dev:
  redis_data_dev:
  uploads_dev:

networks:
  billetterie-network-dev:
    driver: bridge
    name: billetterie-dev-network

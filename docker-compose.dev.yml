# ===================================================================
# DEVELOPMENT ENVIRONMENT - Standalone dev stack + monitoring include
# We include ONLY the monitoring stack to avoid conflicts. The base
# application stack is defined separately and is NOT included here.
# ===================================================================

include:
  - docker-compose.monitoring.yml

services:
  # Note: No overrides of base services to avoid include conflicts
  # Next.js Application - DEVELOPMENT
  web-dev:
    build:
      dockerfile: ./docker/Dockerfile.dev
      target: development
    container_name: billetterie-app-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "9229:9229" # Debug port
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      # Hot reload configuration for Windows/WSL2
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 2000
      FAST_REFRESH: true
      # Disable slow features in dev
      NEXT_TELEMETRY_DISABLED: 1
      TSC_NONPOLLING_WATCHER: true
      # Node.js optimizations
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Avoid JSON issues
      FORCE_COLOR: 0
      CI: false
      HOSTNAME: 0.0.0.0
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - next_cache_dev:/app/.next
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      envgen-dev:
        condition: service_completed_successfully
      db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
    networks:
      - billetterie-dev-network

  # Prisma migrations (DEV) — executed on demand or before web-dev starts
  migrate-dev:
    image: node:22-alpine
    container_name: prisma-migrate-dev
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      envgen-dev:
        condition: service_completed_successfully
      db-dev:
        condition: service_healthy
    command: sh -c "npm install -g prisma@6 @prisma/client@6 && prisma migrate deploy && prisma generate"
    networks:
      - billetterie-dev-network

  # Prisma seed (DEV) — executed on demand
  seed-dev:
    image: node:22-alpine
    container_name: prisma-seed-dev
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - SEED_MODE=dev
    volumes:
      - ./:/app
    depends_on:
      envgen-dev:
        condition: service_completed_successfully
      db-dev:
        condition: service_healthy
    command: sh -c "yarn install --frozen-lockfile --production=false && yarn db:seed"
    networks:
      - billetterie-dev-network
    profiles:
      - dev-init

  # PostgreSQL - DEVELOPMENT
  db-dev:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-DevPostgres2024!SecureDB}
      POSTGRES_DB: ${DB_NAME:-billetterie}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billetterie-dev-network

  # Redis Cache - DEVELOPMENT
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-DevRedis2024!SecureCache}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - billetterie-dev-network

  # Environment generator (DEV) — generates .env.dev if missing
  envgen-dev:
    image: node:22-alpine
    container_name: envgen-dev
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "node scripts/generate-env.js dev || true"
    restart: "no"
    networks:
      - billetterie-dev-network

  # ===================================================================
  # DEVELOPMENT-SPECIFIC TOOLS
  # ===================================================================

  # Mailhog - Email testing in development (dev only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"    # Web UI
    networks:
      - billetterie-dev-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer - PostgreSQL Web Interface (dev only)
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db-dev
      ADMINER_DESIGN: dracula
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      - billetterie-dev-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Commander - Redis Web Interface (dev only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    ports:
      - "8084:8081"
    env_file:
      - .env.dev
    environment:
      PORT: 8081
      REDIS_HOSTS: "local:redis-dev:6379:0:${REDIS_PASSWORD:-redis_dev_2024}"
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin}
    depends_on:
      envgen-dev:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy
    networks:
      - billetterie-dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  node_modules_dev:
  next_cache_dev:
  postgres_data_dev:
  redis_data_dev:
  uploads_dev:

networks:
  billetterie-dev-network:
    name: billetterie-dev-network

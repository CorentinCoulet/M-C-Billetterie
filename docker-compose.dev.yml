# ===================================================================
# DEVELOPMENT ENVIRONMENT - COMPLETELY INDEPENDENT
# ===================================================================

services:
  # Next.js Application - DEVELOPMENT
  web-dev:
    build:
      dockerfile: ./docker/Dockerfile.dev
      target: development
    container_name: billetterie-app-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "9229:9229" # Debug port
    environment:
      NODE_ENV: development
      # Ultra-fast hot reload
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100
      FAST_REFRESH: true
      # Disable slow features in dev
      NEXT_TELEMETRY_DISABLED: 1
      TSC_NONPOLLING_WATCHER: true
      # Node.js optimizations
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Avoid JSON issues
      FORCE_COLOR: 0
      CI: false
      # Services
      DATABASE_URL: postgresql://postgres:postgres123@db-dev:5432/billetterie
      REDIS_URL: redis://:password@redis-dev:6379
      HOSTNAME: 0.0.0.0
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - next_cache_dev:/app/.next/cache
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - billetterie-network-dev
    command: sh -c "yarn dev:docker"

  # PostgreSQL - DEVELOPMENT
  db-dev:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-billetterie}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billetterie-network-dev

  # Redis Cache - DEVELOPMENT
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - billetterie-network-dev

  # ===================================================================
  # DEVELOPMENT-SPECIFIC TOOLS
  # ===================================================================

  # Mailhog - Email testing in development (dev only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"    # Web UI
    networks:
      - billetterie-network-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  node_modules_dev:
  next_cache_dev:
  postgres_data_dev:
  redis_data_dev:
  uploads_dev:

networks:
  billetterie-network-dev:
    driver: bridge
    name: billetterie-dev-network

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: billetterie
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: postgres:16-alpine
            env:
            - name: PGHOST
              value: postgres-master
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: backup_user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: billetterie-secrets
                  key: BACKUP_USER_PASSWORD
            - name: BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: billetterie-secrets
                  key: BACKUP_ENCRYPTION_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: billetterie-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: billetterie-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: S3_BUCKET
              value: "billetterie-backups"
            command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Create backup filename with timestamp
              BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="billetterie_backup_${BACKUP_DATE}.sql"
              ENCRYPTED_FILE="billetterie_backup_${BACKUP_DATE}.sql.enc"
              
              echo "Starting backup at $(date)"
              
              # Create database backup
              pg_dump -h $PGHOST -p $PGPORT -U $PGUSER -d billetterie \
                --verbose --clean --if-exists --create > /backup/${BACKUP_FILE}
              
              if [ $? -eq 0 ]; then
                echo "Database backup successful"
                
                # Encrypt the backup
                openssl enc -aes-256-cbc -salt -in /backup/${BACKUP_FILE} \
                  -out /backup/${ENCRYPTED_FILE} -k ${BACKUP_ENCRYPTION_KEY}
                
                if [ $? -eq 0 ]; then
                  echo "Backup encryption successful"
                  
                  # Remove unencrypted backup
                  rm /backup/${BACKUP_FILE}
                  
                  # Upload to S3 if configured
                  if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
                    apk add --no-cache aws-cli
                    aws s3 cp /backup/${ENCRYPTED_FILE} s3://${S3_BUCKET}/database/
                    if [ $? -eq 0 ]; then
                      echo "Backup uploaded to S3 successfully"
                    else
                      echo "Failed to upload backup to S3"
                    fi
                  fi
                  
                  # Keep only last 7 backups locally
                  find /backup -name "billetterie_backup_*.sql.enc" -type f -mtime +7 -delete
                  
                  echo "Backup completed successfully at $(date)"
                else
                  echo "Backup encryption failed"
                  rm -f /backup/${BACKUP_FILE}
                  exit 1
                fi
              else
                echo "Database backup failed"
                exit 1
              fi
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-cleanup
  namespace: billetterie
spec:
  schedule: "0 4 * * 0"  # Weekly on Sunday at 4 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup-cleanup
            image: amazon/aws-cli:latest
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: billetterie-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: billetterie-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: S3_BUCKET
              value: "billetterie-backups"
            command:
            - /bin/bash
            - -c
            - |
              if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
                echo "Cleaning up old backups in S3..."
                # Delete backups older than 30 days
                aws s3 ls s3://${S3_BUCKET}/database/ --recursive | \
                  awk '{print $1, $2, $4}' | \
                  while read date time file; do
                    datetime="$date $time"
                    cutoff=$(date -d '30 days ago' '+%Y-%m-%d %H:%M:%S')
                    if [[ "$datetime" < "$cutoff" ]]; then
                      echo "Deleting old backup: $file"
                      aws s3 rm s3://${S3_BUCKET}/$file
                    fi
                  done
                echo "S3 backup cleanup completed"
              else
                echo "AWS credentials not configured, skipping S3 cleanup"
              fi
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi
                cpu: 200m


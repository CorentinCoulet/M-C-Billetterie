# Production-ready Kubernetes configuration with security hardening
apiVersion: v1
kind: Namespace
metadata:
  name: billetterie-prod
  labels:
    name: billetterie-prod
    environment: production

---
# Network security policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billetterie-network-policy
  namespace: billetterie-prod
spec:
  podSelector:
    matchLabels:
      app: billetterie
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
# Application deployment with security context
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billetterie-app
  namespace: billetterie-prod
  labels:
    app: billetterie
    version: 1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: billetterie
  template:
    metadata:
      labels:
        app: billetterie
        version: 1.0.0
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: billetterie
        image: your-registry/billetterie:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: billetterie-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: billetterie-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: billetterie-secrets
              key: JWT_SECRET
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: billetterie-secrets
              key: STRIPE_SECRET_KEY
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: billetterie-secrets
              key: SENTRY_DSN
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: 512Mi  # Increased for Node.js
            cpu: 200m      # Increased for better performance
          limits:
            memory: 1Gi    # Prevent OOM kills
            cpu: 1000m     # Allow bursts
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true  # Security hardening
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-cache
          mountPath: /app/.next/cache
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: app-cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - billetterie
              topologyKey: kubernetes.io/hostname

---
# HPA with custom metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billetterie-hpa
  namespace: billetterie-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billetterie-app
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# Pod disruption budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: billetterie-pdb
  namespace: billetterie-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: billetterie

---
# Service account with minimal permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billetterie-sa
  namespace: billetterie-prod
automountServiceAccountToken: false

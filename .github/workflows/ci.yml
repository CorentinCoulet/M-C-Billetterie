name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Avoid multiple executions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  YARN_CACHE_FOLDER: ~/.yarn/cache

jobs:
  # =============================================
  # JOB 1: Lint & Type Check
  # =============================================
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: yarn lint

      - name: 📝 Type check
        run: yarn type-check

  # =============================================
  # JOB 2: Unit & Integration Tests
  # =============================================
  test-unit-integration:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billetterie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🗃️ Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
        run: |
          yarn prisma generate
          yarn prisma migrate deploy

      - name: 🧪 Run Jest tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-jwt-32-characters-long-minimum-for-security
          JWT_REFRESH_SECRET: test-refresh-secret-jwt-32-characters-minimum
          NEXTAUTH_SECRET: test-nextauth-secret-32-characters-long-for-security
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_fake_key
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
          EMAIL_HOST: smtp.test.com
          EMAIL_PORT: 587
          EMAIL_USER: test@test.com
          EMAIL_PASSWORD: testpassword
          EMAIL_FROM: test@test.com
        run: yarn test:ci

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # =============================================
  # JOB 3: E2E Tests avec Playwright
  # =============================================
  test-e2e:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billetterie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: 🗃️ Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
        run: |
          yarn prisma generate
          yarn prisma migrate deploy
          yarn db:seed

      - name: 🎭 Run Playwright tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-jwt-32-characters-long-minimum-for-security
          JWT_REFRESH_SECRET: test-refresh-secret-jwt-32-characters-minimum
          NEXTAUTH_SECRET: test-nextauth-secret-32-characters-long-for-security
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_fake_key
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
          EMAIL_HOST: smtp.test.com
          EMAIL_PORT: 587
          EMAIL_USER: test@test.com
          EMAIL_PASSWORD: testpassword
          EMAIL_FROM: test@test.com
          E2E_BASE_URL: http://localhost:3000
          CI: true
        run: yarn test:e2e --project=chromium

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # =============================================
  # JOB 4: Security Audit
  # =============================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Yarn audit
        run: yarn audit --level high
        continue-on-error: true

      - name: 🔒 Check for vulnerabilities with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

  # =============================================
  # JOB 5: Build Test
  # =============================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-unit-integration]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🗃️ Generate Prisma Client
        run: yarn prisma generate

      - name: 🏗️ Build Next.js application
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          JWT_SECRET: fake-jwt-secret-32-characters-long-minimum-for-build
          JWT_REFRESH_SECRET: fake-refresh-jwt-secret-32-characters-minimum
          NEXTAUTH_SECRET: fake-nextauth-secret-32-characters-long-for-build
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production
        run: yarn build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # =============================================
  # JOB 6: Mutation Testing (Optional - Weekly)
  # =============================================
  mutation-testing:
    name: 🧬 Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only runs on main to save resources
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🧬 Run Stryker mutation tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
          JWT_SECRET: test-secret-jwt-32-characters-long-minimum-for-security
          NODE_ENV: test
        run: yarn test:mutation:ci
        continue-on-error: true

  # =============================================
  # JOB 7: Status Check (Success/Failure)
  # =============================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-unit-integration, test-e2e, build]
    if: success()
    
    steps:
      - name: ✅ All checks passed
        run: echo "All CI checks passed successfully!"

  ci-failure:
    name: ❌ CI Failure
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-unit-integration, test-e2e, build]
    if: failure()
    
    steps:
      - name: ❌ Some checks failed
        run: |
          echo "Some CI checks failed. Please review the logs above."
          exit 1

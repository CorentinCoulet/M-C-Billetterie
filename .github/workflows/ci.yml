name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # =============================================
  # JOB 0: Install Dependencies (shared cache)
  # =============================================
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 💾 Cache node_modules
        uses: actions/cache/save@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

  # =============================================
  # JOB 1: Lint & Type Check
  # =============================================
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    needs: install
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Restore cache
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - name: 📦 Ensure dependencies are installed
        run: yarn install --frozen-lockfile

      - name: 🔍 ESLint
        run: yarn lint

      - name: 📝 TypeScript check
        run: yarn type-check

  # =============================================
  # JOB 2: Unit & Integration Tests
  # =============================================
  test-unit-integration:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: install
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billetterie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Restore cache
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - name: 📦 Ensure dependencies are installed
        run: yarn install --frozen-lockfile

      - name: 🗃️ Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
        run: |
          yarn prisma generate
          yarn prisma migrate deploy

      - name: 🧪 Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-jwt-32-characters-long-minimum-for-security
          JWT_REFRESH_SECRET: test-refresh-secret-jwt-32-characters-minimum
          NEXTAUTH_SECRET: test-nextauth-secret-32-characters-long-for-security
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_fake_key
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
          EMAIL_HOST: smtp.test.com
          EMAIL_PORT: 587
          EMAIL_USER: test@test.com
          EMAIL_PASSWORD: testpassword
          EMAIL_FROM: test@test.com
        run: yarn test:ci

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
        continue-on-error: true

  # =============================================
  # JOB 3: E2E Tests
  # =============================================
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billetterie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Restore cache
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - name: 📦 Ensure dependencies are installed
        run: yarn install --frozen-lockfile

      - name: 🎭 Install Playwright
        run: yarn playwright install --with-deps chromium

      - name: 🗃️ Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
        run: |
          yarn prisma generate
          yarn prisma migrate deploy
          yarn db:seed

      - name: 🎭 Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billetterie_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-jwt-32-characters-long-minimum-for-security
          JWT_REFRESH_SECRET: test-refresh-secret-jwt-32-characters-minimum
          NEXTAUTH_SECRET: test-nextauth-secret-32-characters-long-for-security
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_fake_key
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
          EMAIL_HOST: smtp.test.com
          EMAIL_PORT: 587
          EMAIL_USER: test@test.com
          EMAIL_PASSWORD: testpassword
          EMAIL_FROM: test@test.com
          E2E_BASE_URL: http://localhost:3000
        run: yarn test:e2e --project=chromium

      - name: 📤 Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # =============================================
  # JOB 4: Build Application
  # =============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [install, lint-and-typecheck]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Restore cache
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - name: 📦 Ensure dependencies are installed
        run: yarn install --frozen-lockfile

      - name: 🗃️ Generate Prisma Client
        run: yarn prisma generate

      - name: 🏗️ Build Next.js
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          JWT_SECRET: fake-jwt-secret-32-characters-long-minimum-for-build
          JWT_REFRESH_SECRET: fake-refresh-jwt-secret-32-characters-minimum
          NEXTAUTH_SECRET: fake-nextauth-secret-32-characters-long-for-build
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NODE_ENV: production
        run: yarn build

      - name: 📤 Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # =============================================
  # JOB 5: Final Status
  # =============================================
  ci-status:
    name: ✅ CI Status
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-unit-integration, test-e2e, build]
    if: always()
    
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.test-unit-integration.result }}" == "failure" ]] || \
             [[ "${{ needs.test-e2e.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline failed"
            exit 1
          else
            echo "✅ CI Pipeline succeeded"
          fi

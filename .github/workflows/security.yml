name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Explicit permissions needed for security tooling (CodeQL, SARIF uploads, etc.)
permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================
  # JOB 1: Dependency Security
  # =============================================
  dependency-scan:
    name: 🔒 Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: 🔎 Show tool versions
        run: |
          node -v
          yarn -v

      - name: 🔍 Yarn audit
        run: yarn audit --level moderate
        continue-on-error: true

      - name: 🔒 Snyk scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: ⚠️ Skip Snyk (no token)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN non défini, étape Snyk ignorée."

  # =============================================
  # JOB 2: Code Analysis
  # =============================================
  code-analysis:
    name: 🔍 Code Analysis
    runs-on: ubuntu-latest
    # Skip on PRs from forks because the GITHUB_TOKEN has restricted perms there
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          # Full history helps CodeQL track alerts across runs
          fetch-depth: 0

      - name: 🔍 CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Use the broader set of queries (security + quality) for better coverage
          queries: security-and-quality
          # TS/JS analysis doesn't require a build; disable autobuild to avoid flakiness
          build-mode: none

      - name: 🔍 CodeQL analyze
        uses: github/codeql-action/analyze@v4

  # =============================================
  # JOB 3: Secrets Detection
  # =============================================
  secrets-scan:
    name: 🔐 Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================
  # JOB 4: Docker Security (only on main)
  # =============================================
  docker-scan:
    name: 🐳 Docker Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Build image
        run: docker build -f docker/Dockerfile.next -t billetterie:test .

      - name: 🔒 Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'billetterie:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: 📤 Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================
  # JOB 5: Dockerfile Linting
  # =============================================
  dockerfile-lint:
    name: 🐋 Dockerfile Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.next
        continue-on-error: true

  # =============================================
  # JOB 6: Security Summary
  # =============================================
  security-status:
    name: ✅ Security Status
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-analysis, secrets-scan, dockerfile-lint]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Analysis | ${{ needs.code-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Detection | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint | ${{ needs.dockerfile-lint.result }} |" >> $GITHUB_STEP_SUMMARY


# ModSecurity WAF Configuration for Nginx
# Add this to nginx.conf for enhanced security

# Load ModSecurity
load_module modules/ngx_http_modsecurity_module.so;

http {
    # ModSecurity configuration
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=payment:10m rate=10r/h;
    
    # IP reputation blocking
    geo $blocked_ip {
        default 0;
        include /etc/nginx/blocked_ips.conf;
    }
    
    # Bot detection
    map $http_user_agent $bot {
        default 0;
        ~*bot 1;
        ~*crawler 1;
        ~*spider 1;
        ~*scraper 1;
        "" 1;  # Empty user agent
    }
    
    # Suspicious request patterns
    map $request_uri $suspicious {
        default 0;
        ~*\.\.(\/|\\) 1;  # Path traversal
        ~*(union|select|insert|drop|delete|script|alert|eval) 1;  # Injection attempts
        ~*\x00 1;  # Null bytes
    }
    
    server {
        listen 443 ssl http2;
        server_name your-domain.com;
        
        # Block malicious IPs
        if ($blocked_ip) {
            return 403;
        }
        
        # Block bots on sensitive endpoints
        location ~ ^/(api/auth|api/payment) {
            if ($bot) {
                return 403;
            }
            
            # Rate limiting
            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://web:3000;
        }
        
        # Block suspicious requests
        if ($suspicious) {
            return 403;
        }
        
        # General API rate limiting
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            # Security headers
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

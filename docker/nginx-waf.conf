# Configuration Nginx avec WAF intégré pour la billetterie
# Protection contre les attaques communes et amélioration de la sécurité

# Limite les connexions simultanées par IP
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

# Zone pour rate limiting sur les endpoints sensibles
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=2r/m;

# Géolocalisation et blocage de pays
geo $blocked_country {
    default 0;
    # Bloquer les pays à risque (exemple)
    # CN 1; # Chine
    # RU 1; # Russie
    # KP 1; # Corée du Nord
}

# Détection de User-Agents suspects
map $http_user_agent $blocked_agent {
    default 0;
    "~*bot" 1;
    "~*crawler" 1;
    "~*spider" 1;
    "~*scraper" 1;
    "~*curl" 1;
    "~*wget" 1;
    "~*python" 1;
    "~*java" 1;
    "~*ruby" 1;
    "~*php" 1;
    "~*perl" 1;
    "~*go-http-client" 1;
    "~*scanner" 1;
    "~*grabber" 1;
    "~*harvester" 1;
    "~*ninja" 1;
    "~*masscan" 1;
    "~*zmap" 1;
    "~*nmap" 1;
    "~*sqlmap" 1;
    "~*nikto" 1;
    "~*metasploit" 1;
    "~*burp" 1;
    "~*owasp" 1;
    "~*zap" 1;
    "~*w3af" 1;
    "~*dirbuster" 1;
    "~*dirb" 1;
    "~*gobuster" 1;
    "~*wfuzz" 1;
    "~*hydra" 1;
    "~*medusa" 1;
    "~*brutus" 1;
    "~*ncrack" 1;
    "" 1;
}

# Détection de patterns d'attaque dans l'URL
map $request_uri $blocked_uri {
    default 0;
    "~*(\.\./)" 1;                     # Path traversal
    "~*(\.\.\;)" 1;                    # Path traversal variant
    "~*(\/\.\./)" 1;                   # Directory traversal
    "~*(\%2e\%2e)" 1;                  # Encoded path traversal
    "~*(\%2f\%2e\%2e)" 1;            # Encoded directory traversal
    "~*(union.*select)" 1;             # SQL injection
    "~*(select.*from)" 1;              # SQL injection
    "~*(insert.*into)" 1;              # SQL injection
    "~*(delete.*from)" 1;              # SQL injection
    "~*(drop.*table)" 1;               # SQL injection
    "~*(update.*set)" 1;               # SQL injection
    "~*(create.*table)" 1;             # SQL injection
    "~*(alter.*table)" 1;              # SQL injection
    "~*(<script)" 1;                   # XSS
    "~*(script>)" 1;                   # XSS
    "~*(javascript:)" 1;               # XSS
    "~*(vbscript:)" 1;                 # XSS
    "~*(onload=)" 1;                   # XSS
    "~*(onerror=)" 1;                  # XSS
    "~*(onclick=)" 1;                  # XSS
    "~*(eval\()" 1;                    # Code injection
    "~*(exec\()" 1;                    # Code injection
    "~*(system\()" 1;                  # Code injection
    "~*(cmd\()" 1;                     # Code injection
    "~*(\|)" 1;                        # Command injection
    "~*(&&)" 1;                        # Command injection
    "~*(\;\;)" 1;                      # Command injection
    "~*(\$\()" 1;                      # Command injection
    "~*(\`)" 1;                        # Command injection
    "~*(\%00)" 1;                      # Null byte injection
    "~*(\%0d\%0a)" 1;                  # CRLF injection
    "~*(\.php)" 1;                     # PHP file access
    "~*(\.jsp)" 1;                     # JSP file access
    "~*(\.asp)" 1;                     # ASP file access
    "~*(\.aspx)" 1;                    # ASPX file access
    "~*(phpinfo)" 1;                   # PHP info access
    "~*(phpmyadmin)" 1;                # PhpMyAdmin access
    "~*(mysql)" 1;                     # MySQL access
    "~*(wp-admin)" 1;                  # WordPress admin
    "~*(wp-login)" 1;                  # WordPress login
    "~*(admin)" 1;                     # Admin panel access
    "~*(administrator)" 1;             # Administrator access
    "~*(console)" 1;                   # Console access
    "~*(config)" 1;                    # Config file access
    "~*(passwd)" 1;                    # Password file access
    "~*(shadow)" 1;                    # Shadow file access
    "~*(etc/)" 1;                      # System directory access
    "~*(proc/)" 1;                     # Process directory access
}

# Détection de headers suspects
map $http_x_forwarded_for $suspicious_proxy {
    default 0;
    "~*(^127\.)" 1;           # Localhost forwarding
    "~*(^10\.)" 1;            # Private network forwarding
    "~*(^172\.1[6-9]\.)" 1;   # Private network forwarding  
    "~*(^172\.2[0-9]\.)" 1;   # Private network forwarding
    "~*(^172\.3[0-1]\.)" 1;   # Private network forwarding
    "~*(^192\.168\.)" 1;      # Private network forwarding
}

# Cache pour les IPs bloquées (géré par l'application)
geo $blocked_ip {
    default 0;
    # Les IPs bloquées seront mises à jour dynamiquement
    include /etc/nginx/blocked_ips.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # Configuration SSL/TLS renforcée
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    
    # Protocoles et chiffrements sécurisés uniquement
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=60s;
    resolver_timeout 2s;
    
    # Session SSL
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Headers de sécurité renforcés
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy strict
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://checkout.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; font-src 'self'; object-src 'none'; media-src 'self'; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;" always;
    
    # Feature Policy
    add_header Feature-Policy "accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'self'; usb 'none'" always;

    # Masquer la version de Nginx et autres infos
    server_tokens off;
    more_clear_headers Server;
    add_header Server "WebServer" always;

    # Protection contre les attaques DDoS et brute force
    limit_conn conn_limit_per_ip 20;
    limit_req zone=req_limit_per_ip burst=20 nodelay;
    
    # Client settings sécurisés
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_max_body_size 10M;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # Timeouts de sécurité
    keepalive_timeout 15s;
    send_timeout 10s;
    
    # Buffers limités
    client_body_in_file_only clean;
    client_body_in_single_buffer on;

    # Blocage géographique
    if ($blocked_country) {
        return 403 "Access denied from your country";
    }

    # Blocage des User-Agents suspects
    if ($blocked_agent) {
        return 403 "Automated traffic detected";
    }

    # Blocage des URLs malveillantes
    if ($blocked_uri) {
        return 403 "Malicious request detected";
    }

    # Blocage des proxies suspects
    if ($suspicious_proxy) {
        return 403 "Suspicious proxy detected";
    }

    # Blocage des IPs blacklistées
    if ($blocked_ip) {
        return 403 "IP address blocked";
    }

    # Blocage des requêtes sans User-Agent
    if ($http_user_agent = "") {
        return 403 "User-Agent required";
    }

    # Blocage des requêtes avec des headers suspects
    if ($http_range ~* "(\d*-\d*,){5}") {
        return 416 "Range not satisfiable";
    }

    # Protection contre les requêtes POST sans Content-Type
    location / {
        if ($request_method = POST) {
            set $missing_content_type 0;
            if ($content_type = "") {
                set $missing_content_type 1;
            }
            if ($missing_content_type) {
                return 400 "Content-Type header required";
            }
        }
        
        # Protection contre les gros uploads
        if ($request_method = POST) {
            client_max_body_size 10M;
        }
        
        proxy_pass http://billetterie-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts pour éviter les attaques slow loris
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        
        # Buffers de sécurité
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 1024m;
        
        # Masquer les erreurs du serveur backend
        proxy_intercept_errors on;
    }

    # Endpoints d'authentification avec rate limiting strict
    location ~* ^/api/(auth|login|register|password) {
        limit_req zone=auth_limit burst=3 nodelay;
        
        # Headers supplémentaires pour l'auth
        proxy_set_header X-Auth-Request $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        
        proxy_pass http://billetterie-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints de paiement avec protection renforcée
    location ~* ^/api/(payment|stripe) {
        limit_req zone=payment_limit burst=1 nodelay;
        
        # Seulement HTTPS pour les paiements
        if ($scheme != https) {
            return 301 https://$server_name$request_uri;
        }
        
        # Validation des headers de paiement
        if ($http_content_type !~ "application/json") {
            return 400 "Invalid content type for payment";
        }
        
        proxy_pass http://billetterie-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Logs spéciaux pour les paiements
        access_log /var/log/nginx/payment.log combined;
    }

    # Endpoints admin avec protection maximale
    location ~* ^/api/admin {
        # Autoriser seulement certaines IPs pour l'admin
        allow 192.168.1.0/24;  # Réseau interne
        allow 10.0.0.0/8;      # VPN
        deny all;
        
        limit_req zone=auth_limit burst=1 nodelay;
        
        proxy_pass http://billetterie-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Logs admin
        access_log /var/log/nginx/admin.log combined;
    }

    # Health check (sans rate limiting)
    location = /health {
        access_log off;
        proxy_pass http://billetterie-app:3000;
        proxy_set_header Host $host;
    }

    # Blocage des fichiers sensibles
    location ~* \.(env|log|config|sql|bak|backup|old|tmp|temp)$ {
        deny all;
        return 404;
    }

    # Blocage des répertoires système
    location ~* /(\.git|\.svn|\.hg|CVS|\.env|node_modules|\.well-known\/\.|vendor\/|composer\.|package\.) {
        deny all;
        return 404;
    }

    # Blocage des tentatives d'accès aux outils d'admin
    location ~* /(phpmyadmin|pma|adminer|wp-admin|administrator|console|cpanel|plesk|directadmin) {
        deny all;
        return 404;
    }

    # ACME challenge pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }

    # Logging de sécurité
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Page d'erreur personnalisée
    error_page 403 /403.html;
    location = /403.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    # ACME challenge pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Redirection forcée vers HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Serveur par défaut pour bloquer les requêtes non autorisées
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    
    # Certificat SSL par défaut (auto-signé pour bloquer)
    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;
    
    server_name _;
    return 444; # Nginx close connection
}

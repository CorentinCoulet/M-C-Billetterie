# ============================================================
# NGINX CONFIGURATION - PRODUCTION
# Full security stack with WAF, rate limiting, SSL
# ============================================================

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ========================================
    # BASIC SETTINGS
    # ========================================
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    
    # ========================================
    # SECURITY HEADERS
    # ========================================
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com" always;
    
    # ========================================
    # COMPRESSION
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # ========================================
    # RATE LIMITING ZONES
    # ========================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=payment:10m rate=2r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # ========================================
    # WAF - BLOCKED USER AGENTS
    # ========================================
    map $http_user_agent $blocked_agent {
        default 0;
        "~*bot" 1;
        "~*crawler" 1;
        "~*spider" 1;
        "~*scraper" 1;
        "~*curl" 1;
        "~*wget" 1;
        "~*python" 1;
        "~*scanner" 1;
        "~*sqlmap" 1;
        "~*nikto" 1;
        "~*metasploit" 1;
        "~*burp" 1;
        "~*zap" 1;
        "" 1;
    }
    
    # ========================================
    # WAF - ATTACK PATTERNS IN URI
    # ========================================
    map $request_uri $blocked_uri {
        default 0;
        "~*(\.\./)" 1;                     # Path traversal
        "~*(\%2e\%2e)" 1;                  # Encoded path traversal
        "~*(union.*select)" 1;             # SQL injection
        "~*(select.*from)" 1;              # SQL injection
        "~*(insert.*into)" 1;              # SQL injection
        "~*(delete.*from)" 1;              # SQL injection
        "~*(drop.*table)" 1;               # SQL injection
        "~*(<script)" 1;                   # XSS
        "~*(javascript:)" 1;               # XSS
        "~*(onload=)" 1;                   # XSS
        "~*(eval\()" 1;                    # Code injection
        "~*(exec\()" 1;                    # Code injection
        "~*(\|)" 1;                        # Command injection
        "~*(&&)" 1;                        # Command injection
        "~*(\%00)" 1;                      # Null byte injection
        "~*(\.php)" 1;                     # PHP file access
        "~*(phpinfo)" 1;                   # PHP info access
        "~*(phpmyadmin)" 1;                # PhpMyAdmin access
    }
    
    # ========================================
    # SSL CONFIGURATION
    # ========================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # ========================================
    # LOGGING
    # ========================================
    log_format security '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time '
                       '$ssl_protocol/$ssl_cipher';
    
    access_log /var/log/nginx/access.log security;
    error_log /var/log/nginx/error.log warn;
    
    # ========================================
    # HTTP TO HTTPS REDIRECT
    # ========================================
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # ========================================
    # MAIN HTTPS SERVER WITH WAF
    # ========================================
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;
        
        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
        
        # Connection limits
        limit_conn conn_limit 20;
        
        # ========================================
        # WAF BLOCKING
        # ========================================
        if ($blocked_agent) {
            return 403 "Forbidden: Suspicious user agent detected";
        }
        
        if ($blocked_uri) {
            return 403 "Forbidden: Attack pattern detected";
        }
        
        # ========================================
        # MAIN APPLICATION
        # ========================================
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Hide sensitive headers
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ========================================
        # API ENDPOINTS (STRICTER RATE LIMITING)
        # ========================================
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ========================================
        # AUTH ENDPOINTS (VERY STRICT)
        # ========================================
        location ~ ^/api/(auth|login|register) {
            limit_req zone=auth burst=5 nodelay;
            
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ========================================
        # PAYMENT ENDPOINTS (ULTRA STRICT)
        # ========================================
        location ~ ^/api/(payment|checkout|stripe) {
            limit_req zone=payment burst=2 nodelay;
            
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ========================================
        # STATIC FILES (WITH CACHING)
        # ========================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ========================================
        # HEALTH CHECK (NO RATE LIMITING)
        # ========================================
        location /api/health {
            access_log off;
            proxy_pass http://web:3000;
        }
        
        # ========================================
        # BLOCK SENSITIVE FILES
        # ========================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ \.(sql|log|env)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # ========================================
    # MONITORING SERVER (INTERNAL ONLY)
    # ========================================
    server {
        listen 8080;
        server_name localhost;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        location /nginx_status {
            stub_status on;
            access_log off;
        }
        
        location /metrics {
            proxy_pass http://web:3000/api/metrics;
            access_log off;
        }
    }
}

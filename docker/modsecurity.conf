# ============================================================# Production WAF Configuration for ModSecurity with Nginx

# MODSECURITY CONFIGURATION - PRODUCTION# Advanced Web Application Firewall rules for billetterie

# Unified WAF configuration for billetterie application

# ============================================================# Core Rule Set (CRS) Configuration

SecRuleEngine On

# ========================================SecRequestBodyAccess On

# CORE CONFIGURATIONSecResponseBodyAccess Off

# ========================================SecRequestBodyLimit 13107200

SecRequestBodyNoFilesLimit 131072

# Load OWASP Core Rule SetSecRequestBodyInMemoryLimit 131072

Include /etc/modsecurity/modsecurity.confSecRequestBodyLimitAction Reject

Include /opt/owasp-modsecurity-crs/crs-setup.confSecPcreMatchLimit 250000

Include /opt/owasp-modsecurity-crs/rules/*.confSecPcreMatchLimitRecursion 250000

SecCollectionTimeout 600

# Engine and processing settingsSecDebugLog /var/log/modsec_debug.log

SecRuleEngine OnSecDebugLogLevel 0

SecRequestBodyAccess OnSecAuditEngine RelevantOnly

SecResponseBodyAccess OffSecAuditLogRelevantStatus "^(?:5|4(?!04))"

SecRequestBodyLimit 13107200SecAuditLogParts ABDEFHIJZ

SecRequestBodyNoFilesLimit 131072SecAuditLogType Serial

SecRequestBodyInMemoryLimit 131072SecAuditLog /var/log/modsec_audit.log

SecRequestBodyLimitAction Reject

SecPcreMatchLimit 250000# Custom Rules for Billetterie

SecPcreMatchLimitRecursion 250000# Block common attack patterns

SecCollectionTimeout 600SecRule ARGS "@detectSQLi" \

    "id:1001,\

# ========================================    phase:2,\

# LOGGING CONFIGURATION    block,\

# ========================================    msg:'SQL Injection Attack Detected',\

    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\

SecDebugLog /var/log/modsec_debug.log    tag:'application-multi',\

SecDebugLogLevel 0    tag:'language-multi',\

SecAuditEngine RelevantOnly    tag:'platform-multi',\

SecAuditLogRelevantStatus "^(?:5|4(?!04))"    tag:'attack-sqli'"

SecAuditLogParts ABDEFHIJZ

SecAuditLogType SerialSecRule ARGS "@detectXSS" \

SecAuditLog /var/log/modsec_audit.log    "id:1002,\

    phase:2,\

# ========================================    block,\

# ANOMALY SCORING MODE    msg:'XSS Attack Detected',\

# ========================================    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\

    tag:'application-multi',\

SecDefaultAction "phase:1,log,auditlog,pass"    tag:'language-multi',\

SecDefaultAction "phase:2,log,auditlog,pass"    tag:'platform-multi',\

    tag:'attack-xss'"

# Set anomaly thresholds

SecAction "id:900110,phase:1,nolog,pass,setvar:tx.inbound_anomaly_score_threshold=5"# Rate limiting for authentication endpoints

SecAction "id:900111,phase:2,nolog,pass,setvar:tx.outbound_anomaly_score_threshold=4"SecRule REQUEST_URI "@beginsWith /api/auth" \

    "id:1003,\

# Block high anomaly scores    phase:2,\

SecRule TX:ANOMALY_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \    pass,\

    "id:1100,\    setvar:'ip.auth_attempts=+1',\

    phase:2,\    setvar:'ip.auth_attempts_timeout=60',\

    deny,\    expirevar:'ip.auth_attempts=60'"

    status:403,\

    msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.ANOMALY_SCORE})',\SecRule IP:AUTH_ATTEMPTS "@gt 10" \

    tag:'application-multi',\    "id:1004,\

    tag:'language-multi',\    phase:2,\

    tag:'platform-multi',\    deny,\

    tag:'attack-generic'"    status:429,\

    msg:'Authentication rate limit exceeded',\

# ========================================    tag:'rate-limit',\

# SQL INJECTION PROTECTION    tag:'authentication'"

# ========================================

# Payment endpoint protection

SecRule ARGS "@detectSQLi" \SecRule REQUEST_URI "@beginsWith /api/payments" \

    "id:1001,\    "id:1005,\

    phase:2,\    phase:2,\

    block,\    pass,\

    msg:'SQL Injection Attack Detected in Arguments',\    setvar:'ip.payment_attempts=+1',\

    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\    setvar:'ip.payment_attempts_timeout=3600',\

    tag:'application-multi',\    expirevar:'ip.payment_attempts=3600'"

    tag:'language-multi',\

    tag:'platform-multi',\SecRule IP:PAYMENT_ATTEMPTS "@gt 5" \

    tag:'attack-sqli'"    "id:1006,\

    phase:2,\

SecRule REQUEST_HEADERS:User-Agent "@detectSQLi" \    deny,\

    "id:1101,\    status:429,\

    phase:1,\    msg:'Payment rate limit exceeded',\

    block,\    tag:'rate-limit',\

    msg:'SQL Injection Attack Detected in User Agent',\    tag:'payment'"

    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\

    tag:'attack-sqli'"# Block known bad IPs and patterns

SecRule REMOTE_ADDR "@ipMatchFromFile /etc/nginx/conf.d/ip_blacklist.txt" \

# ========================================    "id:1007,\

# XSS PROTECTION    phase:1,\

# ========================================    deny,\

    status:403,\

SecRule ARGS "@detectXSS" \    msg:'IP address blocked',\

    "id:1002,\    tag:'blacklist'"

    phase:2,\

    block,\# File upload security

    msg:'XSS Attack Detected',\SecRule FILES_TMPNAMES "@inspectFile /usr/local/bin/clamscan" \

    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\    "id:1008,\

    tag:'application-multi',\    phase:2,\

    tag:'language-multi',\    block,\

    tag:'platform-multi',\    msg:'Malware detected in uploaded file',\

    tag:'attack-xss'"    tag:'malware'"



# ========================================SecRule FILES "@validateByteRange 0-255" \

# RATE LIMITING - AUTHENTICATION    "id:1009,\

# ========================================    phase:2,\

    block,\

SecRule REQUEST_URI "@beginsWith /api/auth" \    msg:'Invalid characters in uploaded file',\

    "id:1003,\    tag:'file-upload'"

    phase:1,\

    pass,\# Admin panel protection

    nolog,\SecRule REQUEST_URI "@beginsWith /admin" \

    initcol:ip=%{remote_addr},\    "id:1010,\

    setvar:ip.auth_counter=+1,\    phase:2,\

    expirevar:ip.auth_counter=300"    pass,\

    setvar:'ip.admin_attempts=+1',\

SecRule IP:AUTH_COUNTER "@gt 5" \    setvar:'ip.admin_attempts_timeout=300',\

    "id:1004,\    expirevar:'ip.admin_attempts=300'"

    phase:1,\

    deny,\SecRule IP:ADMIN_ATTEMPTS "@gt 3" \

    status:429,\    "id:1011,\

    msg:'Too many authentication requests',\    phase:2,\

    tag:'dos-protection',\    deny,\

    tag:'authentication'"    status:403,\

    msg:'Admin access blocked - too many attempts',\

# ========================================    tag:'admin-protection'"

# RATE LIMITING - PAYMENT

# ========================================# API key validation

SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9\-._~\+/]+=*$" \

SecRule REQUEST_URI "@beginsWith /api/payment" \    "id:1012,\

    "id:1005,\    phase:2,\

    phase:1,\    pass,\

    pass,\    msg:'Valid Bearer token format',\

    nolog,\    tag:'api-security'"

    initcol:ip=%{remote_addr},\

    setvar:ip.payment_counter=+1,\# Geo-blocking (example for high-risk countries)

    expirevar:ip.payment_counter=600"SecRule REMOTE_ADDR "@geoLookup" \

    "id:1013,\

SecRule IP:PAYMENT_COUNTER "@gt 3" \    phase:1,\

    "id:1006,\    deny,\

    phase:1,\    status:403,\

    deny,\    msg:'Access denied from restricted country',\

    status:429,\    tag:'geo-blocking',\

    msg:'Too many payment requests',\    chain"

    tag:'dos-protection',\SecRule GEO:COUNTRY_CODE "@within CN,RU,KP,IR" \

    tag:'payment'"    "setvar:tx.geo_block=1"



# ========================================# Content-Type validation

# RATE LIMITING - ADMIN PANELSecRule REQUEST_HEADERS:Content-Type "!@rx ^(application/json|application/x-www-form-urlencoded|multipart/form-data)" \

# ========================================    "id:1014,\

    phase:1,\

SecRule REQUEST_URI "@beginsWith /admin" \    deny,\

    "id:1007,\    status:400,\

    phase:1,\    msg:'Invalid Content-Type header',\

    pass,\    tag:'content-type'"

    nolog,\

    initcol:ip=%{remote_addr},\# User-Agent validation

    setvar:ip.admin_counter=+1,\SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \

    expirevar:ip.admin_counter=300"    "id:1015,\

    phase:1,\

SecRule IP:ADMIN_COUNTER "@gt 3" \    deny,\

    "id:1008,\    status:400,\

    phase:1,\    msg:'Missing User-Agent header',\

    deny,\    tag:'user-agent'"

    status:403,\

    msg:'Admin access blocked - too many attempts',\# Custom logging for security events

    tag:'admin-protection'"SecRule TX:ANOMALY_SCORE "@ge 5" \

    "id:1016,\

# ========================================    phase:5,\

# FILE UPLOAD SECURITY    pass,\

# ========================================    msg:'Inbound Anomaly Score Exceeded',\

    logdata:'Total anomaly score: %{TX.anomaly_score}',\

SecRule FILES_TMP_CONTENT "@detectVirus" \    tag:'security-alert'"

    "id:1009,\

    phase:2,\# Emergency rule to block all traffic (can be enabled during attacks)

    block,\# SecRule REMOTE_ADDR "@unconditionalMatch" \

    msg:'Virus found in uploaded file',\#     "id:9999,\

    tag:'attack-generic',\#     phase:1,\

    tag:'malware'"#     deny,\

#     status:503,\

SecRule FILES "@validateByteRange 0-255" \#     msg:'Emergency maintenance mode',\

    "id:1010,\#     tag:'emergency'"

    phase:2,\
    block,\
    msg:'Invalid characters in uploaded file',\
    tag:'file-upload'"

# ========================================
# HTTPS ENFORCEMENT
# ========================================

SecRule REQUEST_URI "@rx ^/(api/(auth|payment)|admin)" \
    "id:1011,\
    phase:1,\
    chain"
    SecRule REQUEST_SCHEME "!@streq https" \
        "deny,\
        status:426,\
        msg:'HTTPS Required for sensitive operations'"

# ========================================
# GEOGRAPHIC RESTRICTIONS
# ========================================

SecGeoLookupDb /usr/share/GeoIP/GeoLite2-Country.mmdb
SecRule GEO:COUNTRY_CODE "@rx ^(CN|RU|KP|IR)$" \
    "id:1012,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Access denied from restricted country: %{GEO:COUNTRY_CODE}',\
    tag:'geo-blocking'"

# ========================================
# IP BLACKLIST
# ========================================

SecRule REMOTE_ADDR "@ipMatchFromFile /etc/nginx/conf.d/ip_blacklist.txt" \
    "id:1013,\
    phase:1,\
    deny,\
    status:403,\
    msg:'IP address blocked',\
    tag:'blacklist'"

# ========================================
# HEADER VALIDATION
# ========================================

# Content-Type validation
SecRule REQUEST_HEADERS:Content-Type "!@rx ^(application/json|application/x-www-form-urlencoded|multipart/form-data)" \
    "id:1014,\
    phase:1,\
    deny,\
    status:400,\
    msg:'Invalid Content-Type header',\
    tag:'content-type'"

# User-Agent validation (must be present)
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:1015,\
    phase:1,\
    deny,\
    status:400,\
    msg:'Missing User-Agent header',\
    tag:'user-agent'"

# API key/Bearer token format validation
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9\-._~\+/]+=*$" \
    "id:1016,\
    phase:2,\
    pass,\
    msg:'Valid Bearer token format',\
    tag:'api-security'"

# ========================================
# SECURITY LOGGING
# ========================================

SecRule TX:ANOMALY_SCORE "@ge 5" \
    "id:1017,\
    phase:5,\
    pass,\
    msg:'Inbound Anomaly Score Exceeded',\
    logdata:'Total anomaly score: %{TX.anomaly_score}',\
    tag:'security-alert'"


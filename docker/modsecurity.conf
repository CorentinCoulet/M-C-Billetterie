# Production WAF Configuration for ModSecurity with Nginx
# Advanced Web Application Firewall rules for billetterie

# Core Rule Set (CRS) Configuration
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject
SecPcreMatchLimit 250000
SecPcreMatchLimitRecursion 250000
SecCollectionTimeout 600
SecDebugLog /var/log/modsec_debug.log
SecDebugLogLevel 0
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABDEFHIJZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

# Custom Rules for Billetterie
# Block common attack patterns
SecRule ARGS "@detectSQLi" \
    "id:1001,\
    phase:2,\
    block,\
    msg:'SQL Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli'"

SecRule ARGS "@detectXSS" \
    "id:1002,\
    phase:2,\
    block,\
    msg:'XSS Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-xss'"

# Rate limiting for authentication endpoints
SecRule REQUEST_URI "@beginsWith /api/auth" \
    "id:1003,\
    phase:2,\
    pass,\
    setvar:'ip.auth_attempts=+1',\
    setvar:'ip.auth_attempts_timeout=60',\
    expirevar:'ip.auth_attempts=60'"

SecRule IP:AUTH_ATTEMPTS "@gt 10" \
    "id:1004,\
    phase:2,\
    deny,\
    status:429,\
    msg:'Authentication rate limit exceeded',\
    tag:'rate-limit',\
    tag:'authentication'"

# Payment endpoint protection
SecRule REQUEST_URI "@beginsWith /api/payments" \
    "id:1005,\
    phase:2,\
    pass,\
    setvar:'ip.payment_attempts=+1',\
    setvar:'ip.payment_attempts_timeout=3600',\
    expirevar:'ip.payment_attempts=3600'"

SecRule IP:PAYMENT_ATTEMPTS "@gt 5" \
    "id:1006,\
    phase:2,\
    deny,\
    status:429,\
    msg:'Payment rate limit exceeded',\
    tag:'rate-limit',\
    tag:'payment'"

# Block known bad IPs and patterns
SecRule REMOTE_ADDR "@ipMatchFromFile /etc/nginx/conf.d/ip_blacklist.txt" \
    "id:1007,\
    phase:1,\
    deny,\
    status:403,\
    msg:'IP address blocked',\
    tag:'blacklist'"

# File upload security
SecRule FILES_TMPNAMES "@inspectFile /usr/local/bin/clamscan" \
    "id:1008,\
    phase:2,\
    block,\
    msg:'Malware detected in uploaded file',\
    tag:'malware'"

SecRule FILES "@validateByteRange 0-255" \
    "id:1009,\
    phase:2,\
    block,\
    msg:'Invalid characters in uploaded file',\
    tag:'file-upload'"

# Admin panel protection
SecRule REQUEST_URI "@beginsWith /admin" \
    "id:1010,\
    phase:2,\
    pass,\
    setvar:'ip.admin_attempts=+1',\
    setvar:'ip.admin_attempts_timeout=300',\
    expirevar:'ip.admin_attempts=300'"

SecRule IP:ADMIN_ATTEMPTS "@gt 3" \
    "id:1011,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Admin access blocked - too many attempts',\
    tag:'admin-protection'"

# API key validation
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9\-._~\+/]+=*$" \
    "id:1012,\
    phase:2,\
    pass,\
    msg:'Valid Bearer token format',\
    tag:'api-security'"

# Geo-blocking (example for high-risk countries)
SecRule REMOTE_ADDR "@geoLookup" \
    "id:1013,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Access denied from restricted country',\
    tag:'geo-blocking',\
    chain"
SecRule GEO:COUNTRY_CODE "@within CN,RU,KP,IR" \
    "setvar:tx.geo_block=1"

# Content-Type validation
SecRule REQUEST_HEADERS:Content-Type "!@rx ^(application/json|application/x-www-form-urlencoded|multipart/form-data)" \
    "id:1014,\
    phase:1,\
    deny,\
    status:400,\
    msg:'Invalid Content-Type header',\
    tag:'content-type'"

# User-Agent validation
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:1015,\
    phase:1,\
    deny,\
    status:400,\
    msg:'Missing User-Agent header',\
    tag:'user-agent'"

# Custom logging for security events
SecRule TX:ANOMALY_SCORE "@ge 5" \
    "id:1016,\
    phase:5,\
    pass,\
    msg:'Inbound Anomaly Score Exceeded',\
    logdata:'Total anomaly score: %{TX.anomaly_score}',\
    tag:'security-alert'"


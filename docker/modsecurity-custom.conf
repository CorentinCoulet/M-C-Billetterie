# ModSecurity main configuration
Include /etc/modsecurity/modsecurity.conf
Include /opt/owasp-modsecurity-crs/crs-setup.conf
Include /opt/owasp-modsecurity-crs/rules/*.conf

# Custom rules for billetterie application
SecRule REQUEST_HEADERS:User-Agent "@detectSQLi" \
    "id:1001,\
    phase:1,\
    block,\
    msg:'SQL Injection Attack Detected in User Agent',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli'"

# Rate limiting for authentication endpoints
SecRule REQUEST_URI "@beginsWith /api/auth/" \
    "id:1002,\
    phase:1,\
    pass,\
    nolog,\
    initcol:ip=%{remote_addr},\
    setvar:ip.auth_counter=+1,\
    expirevar:ip.auth_counter=300"

SecRule IP:AUTH_COUNTER "@gt 5" \
    "id:1003,\
    phase:1,\
    deny,\
    status:429,\
    msg:'Too many authentication requests',\
    tag:'dos-protection'"

# Payment endpoint protection
SecRule REQUEST_URI "@beginsWith /api/payment/" \
    "id:1004,\
    phase:1,\
    pass,\
    nolog,\
    initcol:ip=%{remote_addr},\
    setvar:ip.payment_counter=+1,\
    expirevar:ip.payment_counter=600"

SecRule IP:PAYMENT_COUNTER "@gt 3" \
    "id:1005,\
    phase:1,\
    deny,\
    status:429,\
    msg:'Too many payment requests',\
    tag:'dos-protection'"

# Block suspicious patterns in POST data
SecRule ARGS "@detectSQLi" \
    "id:1006,\
    phase:2,\
    block,\
    msg:'SQL Injection Attack in Arguments',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'attack-sqli'"

# Block XSS attempts
SecRule ARGS "@detectXSS" \
    "id:1007,\
    phase:2,\
    block,\
    msg:'XSS Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'attack-xss'"

# File upload restrictions
SecRule FILES_TMP_CONTENT "@detectVirus" \
    "id:1008,\
    phase:2,\
    block,\
    msg:'Virus found in uploaded file',\
    tag:'attack-generic'"

# Enforce HTTPS for sensitive operations
SecRule REQUEST_URI "@rx ^/(api/(auth|payment)|admin)" \
    "id:1009,\
    phase:1,\
    chain"
    SecRule REQUEST_SCHEME "!@streq https" \
        "deny,\
        status:426,\
        msg:'HTTPS Required for sensitive operations'"

# Geographic restrictions (customize as needed)
SecGeoLookupDb /usr/share/GeoIP/GeoLite2-Country.mmdb
SecRule GEO:COUNTRY_CODE "@rx ^(CN|RU|KP|IR)$" \
    "id:1010,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Access denied from restricted country: %{GEO.COUNTRY_CODE}'"

# Anomaly scoring mode
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Custom anomaly thresholds
SecAction "id:900110,phase:1,nolog,pass,setvar:tx.inbound_anomaly_score_threshold=5"
SecAction "id:900111,phase:2,nolog,pass,setvar:tx.outbound_anomaly_score_threshold=4"

# Block high anomaly scores
SecRule TX:ANOMALY_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:1011,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.ANOMALY_SCORE})',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-generic'"

# PostgreSQL Client Authentication Configuration File
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             postgres                                peer

# IPv4 local connections:
host    all             postgres        127.0.0.1/32            scram-sha-256
host    all             postgres        ::1/128                 scram-sha-256

# Application database connections (require SSL)
hostssl billetterie     billetterie_user 10.0.0.0/8            scram-sha-256
hostssl billetterie     billetterie_user 172.16.0.0/12         scram-sha-256
hostssl billetterie     billetterie_user 192.168.0.0/16        scram-sha-256

# Backup user (local network only)
hostssl all             backup_user     10.0.0.0/8             scram-sha-256
hostssl all             backup_user     172.16.0.0/12          scram-sha-256
hostssl all             backup_user     192.168.0.0/16         scram-sha-256

# Monitoring user (read-only access)
hostssl all             monitoring_user 10.0.0.0/8             scram-sha-256
hostssl all             monitoring_user 172.16.0.0/12          scram-sha-256
hostssl all             monitoring_user 192.168.0.0/16         scram-sha-256

# Deny all other connections
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

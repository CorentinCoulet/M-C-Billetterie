# ===================================================================
# PRODUCTION ENVIRONMENT - COMPLETELY INDEPENDENT
# ===================================================================

services:
  # Next.js Application - PRODUCTION
  web-prod:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.next
    container_name: billetterie-app-prod
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod.local
    volumes:
      - ./logs:/app/logs
      - uploads_prod:/app/uploads
    depends_on:
      db-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    networks:
      - billetterie-network-prod

  # PostgreSQL - PRODUCTION
  db-prod:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-billetterie}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billetterie-network-prod
    command: >
      postgres
      -c log_statement=mod
      -c log_min_duration_statement=1000
      -c log_connections=on
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB

  # Redis - PRODUCTION
  redis-prod:
    image: redis:7-alpine
    container_name: redis-prod
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - billetterie-network-prod
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-password}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --timeout 300
      --tcp-keepalive 300

volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_prod:

networks:
  billetterie-network-prod:
    driver: bridge
    name: billetterie-prod-network